<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的小屋</title>
    <style>  
      body {
        margin: 0;
      }
      .container{
            max-width:700px;
            margin:0 auto;
        }
        .card{
            background:#f9f5f9;
            padding:24px;
            border-radius:12px;
        }
        .item{
            margin-bottom:14px;
        }
        label{
            display:block;
            margin-bottom:6px;
        }
        input,textarea{
            width:100%;
            padding:10px;
            font-size:16px;
        }
        .msg-item{
            border-bottom:1px solid #ddd;
            padding:10px 0;
        }
        .msg-name{
            font-weight:bold;
        }
        .msg-time{
            font-size:13px;
            color:#666;
            margin:4px 0;
        }
    </style>
  </head>
  <body>
    <div style="
      background-color: #f9f5f9;
      text-align: center;
      padding: 20px;
    ">
      <img src='https://tse2-mm.cn.bing.net/th/id/OIP-C.lAFl1fRHcW_WAuRPNttVVwHaHa?w=181&h=181&c=7&r=0&o=7&dpr=1.4&pid=1.7&rm=3' alt='lsh' width='80px' height='80px'>
      <h3>零食小屋</h3>
    </div>
    <div style="
      background-color: #f8f4f1;
      max-width: 700px;
      margin: 30px auto;
      padding: 1px;
      line-height: 1.7;
    ">
    <p>欢迎来到零食小屋，这里没有零食可以吃</p>
    </div>
    
  <div class="container">
        <div class="card">
            <h2>小屋留言板</h2>
            <div class="item">
                <label>昵称</label>
                <input type="text" id="name" placeholder="留下你的昵称">
            </div>
            <div class="item">
                <label>留言内容</label>
                <textarea id="content" placeholder="在这里写下留言..."></textarea>
            </div>
            <div>
                <button id="submitBtn">提交留言</button>
                <button id="clearAll">清空全部留言</button>
            </div>
        </div>
        <div class="card">
            <h2>留言列表</h2>
            <div id="msgList">
            </div>
        </div>
    </div>
    <div></div>
    
    <div>
      <a href="#bottom">跳到页面底部</a>
      <div id="bottom">底部区域</div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ========= 把这里替换成你的信息 =========
    const SUPABASE_URL = "https://rxfnfhfmovnfsgsfojon.supabase.coL";
    const SUPABASE_ANON_KEY = "sb_publishable_7YU1IGHuevQYg-x-oc1S2A_LmkhY_-1";
    // ======================================
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById('name');
    const contentInput = document.getElementById('content');
    const submitBtn = document.getElementById('submitBtn');
    const clearAllBtn = document.getElementById('clearAll');
    const msgList = document.getElementById('msgList');

    // 加载云端留言
    async function render(){
        // 按时间倒序，最新留言在最上面
        const {data, error} = await supabase
            .from("messages")
            .select("*")
            .order("created_at", {ascending: false});
        if(error){
            console.error(error);
            alert("读取留言失败！");
            return;
        }
        msgList.innerHTML = "";
        data.forEach(item=>{
            let div = document.createElement("div");
            div.className = "msg-item";
            div.innerHTML = `
                <div class="msg-name">${item.name}</div>
                <div class="msg-time">${new Date(item.created_at).toLocaleString()}</div>
                <div class="msg-content">${item.content}</div>
            `
            msgList.appendChild(div);
        })
    }

    // 提交留言到supabase
    submitBtn.onclick = async function(){
        let name = nameInput.value.trim();
        let content = contentInput.value.trim();
        if(!name || !content){
            alert("昵称和留言不能为空！");
            return;
        }
        const {error} = await supabase
            .from("messages")
            .insert([{name, content}]);
        if(error){
            alert("提交失败：" + error.message);
        }else{
            nameInput.value = "";
            contentInput.value = "";
            render(); // 提交成功刷新留言列表
        }
    }

    // 清空全部留言（⚠️所有人的留言都会删掉！谨慎使用）
    clearAllBtn.onclick = async function(){
        if(confirm("确定清空所有留言吗？所有人的留言都会删除！不可恢复！")){
            const {error} = await supabase.from("messages").delete().neq("id", 0);
            if(!error) render();
            else alert("清空失败："+error.message);
        }
    }

    // 页面打开自动加载留言
    render();
</script>
  </body>
</html>
