<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的小屋</title>
    <style>  
      body {
 margin: 0;
 background-color: #f9f5f9;
}
.container{
      max-width:700px;
      margin:0 auto;
  }
  .card{
      background:#f9f5f9;
      padding:24px;
      border-radius:12px;
      box-shadow: 0 2px 8px rgba(130,115,105,0.1);
     margin-bottom:25px;
  }
  .item{
      margin-bottom:14px;
  }
  label{
      display:block;
      margin-bottom:6px;
      color:#5c524b;
  }
  input,textarea{
      width:100%;
      padding:10px;
      border:1px solid #d9ccc2;
      border-radius:8px;
      font-size:16px;
      background:#fff;
      color:#443c37;
  }
  input:focus,textarea:focus{
      outline: none;
      border-color:#b8a89a;
  }
  button#submitBtn{
    padding:9px 16px;
    border:none;
    border-radius:8px;
    background:#d4c5c3;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    transition: 0.2s;
}
button#submitBtn:hover{
    background:#c0b0ae;
}
.tab-btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    margin-right:8px;
    background:#ece6e6;
    color:#5b5150;
    cursor:pointer;
    transition:0.2s;
}
.tab-btn:hover{
    background:#ddd2d1;
}
.tab-btn.active{
    background:#d4c5c3;
    color:#ffffff;
}
input,textarea{
    width:100%;
    padding:10px;
    border:1px solid #e2d5d3;
    border-radius:8px;
    font-size:16px;
    background:#fff;
    color:#5b5150;
}
input:focus,textarea:focus{
    outline: none;
    border-color:#c9b7b4;
}
.msg-item{
    background: #fbf7f7;
    border-radius: 14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: 0 2px 6px rgba(180, 160, 158, 0.08);
}
.msg-name{
    font-weight:bold;
    margin-bottom:6px;
    color:#5b5150;
}
.msg-time{
    font-size:12px;
    color:#a79997;
    margin-bottom:8px;
}
.msg-content{
    line-height:1.6;
    color:#5b5150;
}
/*回复气泡样式*/
.reply-block{
    margin-top:12px;
    padding:10px 14px;
    background:#f3eeed;
    border-radius:8px;
}
.reply-name{
    font-weight:bold;
    font-size:14px;
    color:#5b5150;
}
.reply-time{
    font-size:11px;
    color:#a79997;
    margin:3px 0 4px;
}
.reply-content{
    font-size:14px;
    color:#5b5150;
}
.replyBtn{
    margin-top:10px;
    padding:4px 10px;
    font-size:13px;
    border:none;
    border-radius:6px;
    background:#ece6e6;
    color:#5b5150;
    cursor:pointer;
    transition:0.2s;
}
.replyBtn:hover{
    background:#ddd2d1;
}
/*弹窗样式*/
#replyModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.15);
    align-items:center;
    justify-content:center;
    z-index:999;
}
#replyModal.open{
    display:flex;
}
#replyModal textarea{
    width:100%;
    padding:10px;
    border:1px solid #e2d5d3;
    border-radius:8px;
    min-height:80px;
}
    </style>
  </head>
  <body>
    <div id="top"></div>
    <div style="
      background-color: #f9f5f9;
      text-align: center;
      padding: 20px;
      max-width:700px;
      margin:0 auto;
      border-radius:12px;
      box-shadow: 0 2px 8px #e9d9c6;
      margin-bottom:25px;
    ">
      <img src='https://tse2-mm.cn.bing.net/th/id/OIP-C.lAFl1fRHcW_WAuRPNttVVwHaHa?w=181&h=181&c=7&r=0&o=7&dpr=1.4&pid=1.7&rm=3' alt='lsh' width='80px' height='80px'>
      <h3>零食小屋</h3>
    </div>
    <div class="container">
        <div class="card">
    <p>欢迎来到零食小屋，不要偷吃零食！！！</p>
    </div>
    
        <div class="card">
            <h3>小屋留言板</h3>
<div class="item">
  <label>选择板块</label>
  <select id="categorySelect">
    <option value="sheep">羊村</option>
    <option value="food">美食街</option>
    <option value="soul">许愿池</option>
    <option value="cos">cos区</option>
  </select>
</div>
<div class="item">
    <label>虚拟昵称（请乱取名！）</label>
    <input type="text" id="nickname" placeholder="起一个好玩的匿名昵称">
</div>
<div class="item">
    <label>真实昵称（3天后揭晓哦）</label>
    <input type="text" id="realname" placeholder="填写你的真实姓名">
</div>
<div class="item">
    <label>留言内容</label>
    <textarea id="content" placeholder="在这里写下留言..."></textarea>
</div>
            <div>
                <button id="submitBtn">提交留言</button>
            </div>
        </div>
        <div class="card">
            <h3>留言列表</h3>
            <div class="tab-group">
              <button class="tab-btn" data-filter="">全部留言</button>
              <button class="tab-btn" data-filter="food">美食街</button>
              <button class="tab-btn" data-filter="sheep">羊村</button>
              <button class="tab-btn" data-filter="cos">cos区</button>
              <button class="tab-btn" data-filter="soul">许愿池</button>
              
            </div>
            <div id="msgList">
            </div>
        </div>
    </div>
    
    <div>
      <a href="#top">跳到页面顶部</a>
    </div>

<!--回复弹窗：这里style只保留display:none！！-->
<div id="replyModal" style="display:none;">
  <div style="background:#fff;padding:20px;border-radius:12px;width:90%;max-width:500px;">
    <h4>回复这条留言</h4>
    <div class="item">
        <label>回复虚拟昵称</label>
        <input type="text" id="replyNickname" placeholder="你的虚拟昵称">
    </div>
    <div class="item">
        <label>回复真实昵称（3天后揭晓）</label>
        <input type="text" id="replyRealname" placeholder="填写真实昵称">
    </div>
    <textarea id="replyText" style="width:100%;padding:10px;border:1px solid #e2d5d3;border-radius:8px;min-height:80px;" placeholder="写下回复内容"></textarea>
    <div style="margin-top:12px;display:flex;gap:10px;">
      <button id="sendReplyBtn">提交回复</button>
      <button id="closeReplyBtn">取消</button>
    </div>
  </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const SUPABASE_URL = "https://rxfnfhfmovnfsgsfojon.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7YU1IGHuevQYg-x-oc1S2A_LmkhY_-1";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const nicknameInput = document.getElementById('nickname');
    const realnameInput = document.getElementById('realname');
    const contentInput = document.getElementById('content');
    const submitBtn = document.getElementById('submitBtn');
    const msgList = document.getElementById('msgList');
    const categorySelect = document.getElementById('categorySelect');
    const THREE_DAY_MS = 3 * 24 * 60 * 60 * 1000;
    let currentFilter = "";

    //回复弹窗DOM
    const replyModal = document.getElementById('replyModal');
    const replyNicknameInput = document.getElementById('replyNickname');
    const replyRealnameInput = document.getElementById('replyRealname');
    const replyText = document.getElementById('replyText');
    const sendReplyBtn = document.getElementById('sendReplyBtn');
    const closeReplyBtn = document.getElementById('closeReplyBtn');
    let replyingToId = null;

    function updateTabActive(){
        document.querySelectorAll('.tab-btn').forEach(btn=>{
            if(btn.dataset.filter === currentFilter){
                btn.classList.add('active')
            }else{
                btn.classList.remove('active')
            }
        })
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.onclick = function(){
            currentFilter = this.dataset.filter;
            render();
            updateTabActive();
        }
    })

    //打开回复弹窗
    function openReplyModal(mainId){
        replyingToId = mainId;
        replyNicknameInput.value = "";
        replyRealnameInput.value = "";
        replyText.value = "";
        replyModal.classList.add("open");
    }
    //关闭弹窗
    function closeReplyModal(){
        replyingToId = null;
        replyModal.classList.remove("open");
    }
    closeReplyBtn.onclick = closeReplyModal;

    //提交回复
    sendReplyBtn.onclick = async function(){
        const rNick = replyNicknameInput.value.trim();
        const rReal = replyRealnameInput.value.trim();
        const rContent = replyText.value.trim();
        if(!rNick || !rReal || !rContent){
            alert("虚拟昵称、真实昵称、回复内容不能为空！");
            return;
        }
        const {error} = await supabase.from("messages").insert([{
            nickname: rNick,
            realname: rReal,
            content: rContent,
            category: "",
            reply_to: replyingToId
        }])
        if(error){
            alert("回复失败："+error.message)
        }else{
            closeReplyModal();
            render();
        }
    }

    async function render(){
        const {data, error} = await supabase
            .from("messages")
            .select("*")
            .order("created_at", {ascending: false});
        console.log("拿到的数据：", data);
        console.log("错误：", error);
        if(error){
            console.error(error);
            alert("读取留言失败！");
            return;
        }
        msgList.innerHTML = "";
        const now = Date.now();
        // 筛选板块
        let filteredData = data;
        if(currentFilter !== ""){
            filteredData = data.filter(item => item.category === currentFilter);
        }

        //只渲染主留言（reply_to为空）
        filteredData.forEach(item=>{
            if(item.reply_to) return;

            let div = document.createElement("div");
            div.className = "msg-item";
            let categoryText = "";
            if(item.category === "sheep") categoryText = "【羊村】";
            if(item.category === "food") categoryText = "【美食街】";
            if(item.category === "soul") categoryText = "【许愿池】";
            if(item.category === "cos") categoryText = "【cos区】";
            let showName;
            if (!item.nickname) {
                showName = (item.name || "匿名") + "（旧留言）" + categoryText;
            } else {
                const createTime = new Date(item.created_at).getTime();
                const diff = now - createTime;
                if(diff >= THREE_DAY_MS){
                    showName = `${item.nickname}（${item.realname}）` + categoryText;
                }else{
                    showName = item.nickname + "（匿名中）" + categoryText;
                }
            }

            //查找这条主留言所有回复
            const replies = data.filter(r => r.reply_to === item.id);
            let replyHtml = "";
            replies.forEach(reply=>{
                let replyShowName;
                const replyCreateTime = new Date(reply.created_at).getTime();
                const replyDiff = now - replyCreateTime;
                if(replyDiff >= THREE_DAY_MS){
                    replyShowName = `${reply.nickname}（${reply.realname}）`;
                }else{
                    replyShowName = reply.nickname + "（匿名中）";
                }
                replyHtml += `
                <div class="reply-block">
                    <div class="reply-name">${replyShowName}</div>
                    <div class="reply-time">${new Date(reply.created_at).toLocaleString()}</div>
                    <div class="reply-content">${reply.content}</div>
                </div>
                `
            })

            div.innerHTML = `
             <div class="msg-name">${showName}</div>
             <div class="msg-time">${new Date(item.created_at).toLocaleString()}</div>
             <div class="msg-content">${item.content}</div>
             <button class="replyBtn" data-id="${item.id}">回复</button>
             ${replyHtml}
            `
            msgList.appendChild(div);
        })

        //绑定所有回复按钮点击事件
        document.querySelectorAll('.replyBtn').forEach(btn=>{
            btn.onclick = function(){
                openReplyModal(this.dataset.id)
            }
        })
        updateTabActive();
    }
    
    submitBtn.onclick = async function(){
        let nickname = nicknameInput.value.trim();
        let realname = realnameInput.value.trim();
        let content = contentInput.value.trim();
        if(!nickname || !realname || !content){
            alert("虚拟昵称、真实昵称、留言内容都不能为空！");
            return;
        }
        const {error} = await supabase
            .from("messages")
            .insert([{ 
                nickname, 
                realname, 
                content,
                category: categorySelect.value 
            }]);
        if(error){
            alert("提交失败：" + error.message);
        }else{
            nicknameInput.value = "";
            realnameInput.value = "";
            contentInput.value = "";
            render();
        }
    }
    render();
    updateTabActive();
</script>
  </body>
</html>
