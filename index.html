<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的小屋</title>
  <style>    
    body {
      margin: 0;
      background-color: #f9f5f9;
      font-family: system-ui, sans-serif;
    }
    .container{
      max-width:700px;
      margin:0 auto;
      padding: 20px;
    }
    #homePage{
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }
    .enter-btn{
      background:#d8cfd8;
      border:none;
      color:#4a4a4a;
      padding:14px 32px;
      border-radius:99px;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }
    .enter-btn:hover{
      background:#c9bcc9;
    }
    #messagePage{
      display:none;
    }
    .card{
      background:#fff;
      padding:24px;
      border-radius:12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom:16px;
    }
    .msg-bubble{
      background:#f1ecf1;
      border-radius:10px;
      padding:16px;
      margin-bottom:12px;
    }
    .back-btn{
      background:#e2d9e2;
      border:none;
      color:#4a4a4a;
      padding:8px 16px;
      border-radius:8px;
      cursor:pointer;
      margin-bottom:20px;
    }
    input, textarea, select{
      width:100%;
      box-sizing:border-box;
      padding:10px;
      border:1px solid #ddd;
      border-radius:8px;
      margin:6px 0;
    }
    .submit-btn{
      background:#d8cfd8;
      border:none;
      padding:10px 20px;
      border-radius:8px;
      cursor:pointer;
    }
    #replyModal{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.2);
      align-items:center;
      justify-content:center;
    }
    .modal-inner{
      background:white;
      padding:24px;
      border-radius:12px;
      max-width:500px;
      width:90%;
    }
  </style>
</head>
<body>
<div class="container">
  <div id="homePage">
    <img src='https://tse2-mm.cn.bing.net/th/id/OIP-C.lAFl1fRHcW_WAuRPNttVVwHaHa?w=181&h=181&c=7&r=0&o=7&dpr=1.4&pid=1.7&rm=3' alt='lsh' width='80px' height='80px'>
    <h2>我的小屋</h2>
    <p>欢迎来到这里</p>
    <button class="enter-btn" onclick="goMessagePage()">进入留言板</button>
  </div>
  <div id="messagePage">
    <button class="back-btn" onclick="goHome()">← 返回主页</button>
    <div class="card">
      <h3>写下留言</h3>
      <select id="groupSelect">
        <option value="高中同学">高中同学</option>
        <option value="大学同学">大学同学</option>
      </select>
      <input type="text" id="virtualName" placeholder="虚拟昵称">
      <input type="text" id="realName" placeholder="真实姓名">
      <textarea id="msgContent" rows="4" placeholder="留言内容"></textarea>
      <button class="submit-btn" onclick="submitMessage()">提交留言</button>
    </div>
    <div id="msgList"></div>
  </div>
</div>
<div id="replyModal">
  <div class="modal-inner">
    <h4>回复留言</h4>
    <textarea id="replyContent" rows="4"></textarea>
    <input type="hidden" id="replyTargetId">
    <button onclick="openReplyModal()">发送</button>
    <button onclick="closeReplyModal()">取消</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://rxfnfhfmovnfsgsfojon.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_7YU1IGHuevQYg-x-oc1S2A_LmkhY_-1";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.goMessagePage = function(){
  document.getElementById('homePage').style.display = "none";
  document.getElementById('messagePage').style.display = "block";
  loadMessages();
}
window.goHome = function(){
  document.getElementById('homePage').style.display = "flex";
  document.getElementById('messagePage').style.display = "none";
}
window.openReplyModal = function(msgId){
  document.getElementById("replyTargetId").value = msgId;
  document.getElementById("replyContent").value = "";
  document.getElementById("replyModal").style.display = "flex";
}
window.closeReplyModal = function(){
  document.getElementById("replyModal").style.display = "none";
}
async function loadMessages(){
  const {data, error} = await supabase
    .from('messages')
    .select('*')
    .order('created_at', {asc:false});
  if(error){
    console.error(error);
    return;
  }
  const msgListDom = document.getElementById("msgList");
  msgListDom.innerHTML = "";
  const now = new Date();
  const threeDayMs = 3 * 24 * 60 * 60 * 1000;
  data.forEach(msg=>{
    const createTime = new Date(msg.created_at);
    const diff = now - createTime;
    let showName;
    if(diff > threeDayMs){
      showName = `${msg.virtual_name}（${msg.real_name}）`;
    }else{
      showName = msg.virtual_name;
    }
    const html = `
      <div class="msg-bubble">
        <div><strong>${showName}</strong> · ${msg.group}</div>
        <div>${msg.content}</div>
        <div style="margin-top:8px">
          <button onclick="openReplyModal(${msg.id})">回复</button>
        </div>
      </div>
    `;
    msgListDom.innerHTML += html;
  })
}
window.submitMessage = async function(){
  const group = document.getElementById("groupSelect").value;
  const virtualName = document.getElementById("virtualName").value.trim();
  const realName = document.getElementById("realName").value.trim();
  const content = document.getElementById("msgContent").value.trim();
  if(!virtualName || !content){
    alert("虚拟昵称和留言不能为空");
    return;
  }
  const {error} = await supabase.from('messages').insert([{
    group: group,
    virtual_name: virtualName,
    real_name: realName,
    content: content,
    created_at: new Date()
  }])
  if(error){
    alert("提交失败："+error.message);
    console.error(error);
  }else{
    alert("留言成功！");
    document.getElementById("virtualName").value = "";
    document.getElementById("realName").value = "";
    document.getElementById("msgContent").value = "";
    loadMessages();
  }
}
window.sendReply = async function(){
  const replyTo = document.getElementById("replyTargetId").value;
  const content = document.getElementById("replyContent").value.trim();
  if(!content) return;
  const {error} = await supabase.from('messages').insert([{
    reply_to: replyTo,
    content: content,
    virtual_name: "回复用户",
    real_name: "",
    group: "",
    created_at: new Date()
  }])
  if(error){
    alert(error.message);
  }else{
    closeReplyModal();
    loadMessages();
  }
}
</script>
</body>
</html>
