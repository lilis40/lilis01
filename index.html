  <body>

    <div style="
      background-color: #f9f5f9;

    ">
      <img src='https://tse2-mm.cn.bing.net/th/id/OIP-C.lAFl1fRHcW_WAuRPNttVVwHaHa?w=181&h=181&c=7&r=0&o=7&dpr=1.4&pid=1.7&rm=3' alt='lsh' width='80px' height='80px'>

  <div class="container">
        <div class="card">
            <h2>小屋留言板</h2>
            <div class="item">
    <label>✨虚拟昵称（用于现在对外展示）</label>
    <input type="text" id="nickname" placeholder="起一个好玩的匿名昵称">
</div>
<div class="item">
    <label>🔒真实姓名（3天后揭晓哦！）</label>
    <input type="text" id="realname" placeholder="填写你的真实姓名">
</div>
<div class="item">
    <label>留言内容</label>
    <textarea id="content" placeholder="在这里写下留言..."></textarea>
</div>
            <div>
                <button id="submitBtn">提交留言</button>
            </div>
        </div>

        <div class="card">
            <h2>留言列表</h2>
            <div id="msgList">
            </div>
        </div>
    </div>
    <div></div>
    
    <div>
      <a href="#top">跳到页面顶部</a>
      
    </div>
<script>
    const BIN_ID = "6ac91150ffd5d160535cb594"; 
    const API_KEY = "$2a$10$KkNJBEuwfqLitWNXE5G1auucdowT62sFO5sUd9Znm773JscOjo4ru";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nicknameInput = document.getElementById('nickname');
    const realnameInput = document.getElementById('realname');
    const contentInput = document.getElementById('content');
    const submitBtn = document.getElementById('submitBtn');
    const msgList = document.getElementById('msgList');

    const THREE_DAY_MS = 3 * 24 * 60 * 60 * 1000;

    async function render(){
    const {data, error} = await supabase
        .from("messages")
        .select("*")
        .order("created_at", {ascending: false});
    console.log("拿到的数据：", data);
    console.log("错误：", error);
    if(error){
        console.error(error);
        alert("读取留言失败！");
        return;
    }
    msgList.innerHTML = "";
    const now = Date.now();

    data.forEach(item=>{
        let div = document.createElement("div");
        div.className = "msg-item";

        let showName;
        // 兼容旧留言：没有nickname就读取原来的name，兜底防止空白
        if (!item.nickname) {
            showName = (item.name || "匿名") + "（旧留言）";
        } else {
            //新留言3天倒计时逻辑
            const createTime = new Date(item.created_at).getTime();
            const diff = now - createTime;
            const THREE_DAY_MS = 3 * 24 * 60 * 60 * 1000;
            if(diff >= THREE_DAY_MS){
                showName = item.realname + "（身份已揭晓）";
            }else{
                showName = item.nickname + "（匿名中，等待揭晓）";
            }
        }

        div.innerHTML = `
            <div class="msg-name">${showName}</div>
            <div class="msg-time">${new Date(item.created_at).toLocaleString()}</div>
            <div class="msg-content">${item.content}</div>
        `
        msgList.appendChild(div);
    })
}


    submitBtn.onclick = async function(){
        let nickname = nicknameInput.value.trim();
        let realname = realnameInput.value.trim();
        let content = contentInput.value.trim();

        if(!nickname || !realname || !content){
            alert("虚拟昵称、真实姓名、留言内容都不能为空！");
            return;
        }
        const {error} = await supabase
            .from("messages")
            .insert([{ nickname, realname, content }]);
        if(error){
            alert("提交失败：" + error.message);
        }else{
            nicknameInput.value = "";
            realnameInput.value = "";
            contentInput.value = "";
            render();
        }
    }

    render();
</script>
  </body>
